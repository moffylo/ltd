<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flour Moffylo Limited</title>

    <!-- Font Awesome (ONLY ONE VERSION) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background: #eaeaea;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        .container{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1000px;
            height: 600px;
            background: #f5f5f5;
            box-shadow: 0 30px 50px #dbdbdb;
        }

        .container .slide .item{
            width: 200px;
            height: 300px;
            position: absolute;
            top: 50%;
            transform: translate(0, -50%);
            border-radius: 20px;
            box-shadow: 0 30px 50px #505050;
            background-position: center;
            background-size: cover;
            transition: 0.5s;
        }

        .slide .item:nth-child(1),
        .slide .item:nth-child(2){
            top: 0;
            left: 0;
            transform: translate(0, 0);
            border-radius: 0;
            width: 100%;
            height: 100%;
        }

        .slide .item:nth-child(3){ left: 50%; }
        .slide .item:nth-child(4){ left: calc(50% + 220px); }
        .slide .item:nth-child(5){ left: calc(50% + 440px); }

        .slide .item:nth-child(n + 6){
            left: calc(50% + 660px);
            opacity: 0;
        }

        .item .content{
            position: absolute;
            top: 50%;
            left: 100px;
            width: 300px;
            color: #fff;
            transform: translateY(-50%);
            display: none;
        }

        .slide .item:nth-child(2) .content{
            display: block;
        }

        .content .name{
            font-size: 40px;
            font-weight: bold;
            opacity: 0;
            animation: fadeIn 1s forwards;
        }

        .content .des{
            margin: 10px 0 20px;
            opacity: 0;
            animation: fadeIn 1s 0.3s forwards;
        }

        .content button{
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            opacity: 0;
            animation: fadeIn 1s 0.6s forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .button{
            width: 100%;
            text-align: center;
            position: absolute;
            bottom: 20px;
        }

        .button button{
            width: 40px;
            height: 35px;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 5px;
            border: 1px solid #000;
        }

        .button button:hover{
            background: #333;
            color: #fff;
        }
        
    @media only screen and (max-width: 600px){

    body{
        overflow: auto;
    }

    .container{
        width: 95%;
        height: 500px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    .container .slide .item{
        width: 120px;
        height: 180px;
    }

    /* Main active slides */
    .slide .item:nth-child(1),
    .slide .item:nth-child(2){
        width: 100%;
        height: 100%;
        border-radius: 0;
    }

    /* Stack smaller previews tighter */
    .slide .item:nth-child(3){
        left: 60%;
    }

    .slide .item:nth-child(4){
        left: calc(60% + 130px);
    }

    .slide .item:nth-child(5){
        left: calc(60% + 260px);
    }

    .slide .item:nth-child(n + 6){
        left: calc(60% + 390px);
        opacity: 0;
    }

    /* Content adjustments */
    .item .content{
        left: 20px;
        width: 80%;
    }

    .content .name{
        font-size: 22px;
    }

    .content .des{
        font-size: 14px;
    }

    .content button{
        padding: 8px 15px;
        font-size: 12px;
    }

    /* Buttons */
    .button{
        bottom: 10px;
    }

    .button button{
        width: 35px;
        height: 30px;
        font-size: 12px;
    }
}
.slide .item:nth-child(n + 4){
    display: none;
}
    </style>
</head>

<body>
    

<div class="container">

    <div class="slide">

       <div class="item" style="background-image: url('fd6.jpg');">
            <div class="content">
                <div class="name">FLOUR</div>
                <button style="border-radius: 10px; background-color: rgba(24, 100, 171, 0.5); color: #fff; border: 1px solid #3498db; text-align: left; ">Beautify your space with our premium stainless fittings.</button>
            </div>
        </div>


            <div class="item" style="background-image: url('sf1.jpg');">
            <div class="content">
                <div class="name">FLOUR</div>
                <button style="border-radius: 10px; background-color: rgba(24, 100, 171, 0.5); color: #fff; border: 1px solid #3498db; text-align: left; "> Styles and amazing design to elevate your space.</button>
            </div>
        </div>

        <div class="item" style="background-image: url('sf2.jpg');">
            <div class="content">
                <div class="name">FLOUR</div>
                <button style="border-radius: 10px; background-color: rgba(24, 100, 171, 0.5); color: #fff; border: 1px solid #3498db; text-align: left; ">We deliver solid and quality stainless fittings products.</button>
            </div>
        </div>

       <div class="item" style="background-image: url('sf3.jpg');">
            <div class="content">
                <div class="name">FLOUR</div>
                <button style="border-radius: 10px; background-color: rgba(24, 100, 171, 0.5); color: #fff; border: 1px solid #3498db; text-align: left; ">With our experience staffs, we ensure top-notch service and quality. </button>
            </div>
        </div>

       <div class="item" style="background-image: url('sf4.jpg');">
            <div class="content">
                <div class="name">FLOUR</div>
                <button style="border-radius: 10px; background-color: rgba(24, 100, 171, 0.5); color: #fff; border: 1px solid #3498db; text-align: left; ">Whether indoor or outdoor services, we are here to deliver a 5 star performance. </button>
            </div>
        </div>


       <div class="item" style="background-image: url('sf5.jpg');">
            <div class="content">
                <div class="name">FLOUR</div>
                <button style="border-radius: 10px; background-color: rgba(24, 100, 171, 0.5); color: #fff; border: 1px solid #3498db; text-align: left; ">Home, office or commercial spaces.</button>
            </div>
        </div>

    </div>

    <div class="button">
        <button class="prev"><i class="fa-solid fa-arrow-left"></i></button>
        <button class="next"><i class="fa-solid fa-arrow-right"></i></button>
    </div>

</div>


<!-- JS placed AFTER elements (FIXED) -->
<script>
    const next = document.querySelector('.next');
    const prev = document.querySelector('.prev');

    next.addEventListener('click', function(){
        const items = document.querySelectorAll('.item');
        document.querySelector('.slide').appendChild(items[0]);
    });

    prev.addEventListener('click', function(){
        const items = document.querySelectorAll('.item');
        document.querySelector('.slide').prepend(items[items.length - 1]);
    });

    // BONUS: Keyboard arrow support
    document.addEventListener('keydown', function(e){
        if(e.key === "ArrowRight"){
            next.click();
        }
        if(e.key === "ArrowLeft"){
            prev.click();
        }
    });
</script>

</body>
</html>
